[project]
name = "levi-workbench"
version = "0.3.0"
description = "LEVI — LeRobot Exploration, Validation & Integration"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "LEVI contributors" }]
keywords = ["lerobot", "robot-learning", "imitation-learning", "dataset-visualization", "data-annotation", "vision-language-model"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: FastAPI",
]
dependencies = ["python-dotenv>=1,<2", "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3", "pandas>=2.2,<3", "pyarrow>=19,<24", "huggingface-hub>=0.30,<2", "numpy>=2,<3", "opencv-python-headless>=4.10,<5"]

[project.optional-dependencies]
agent = ["pydantic-ai-slim[openai]>=1.0,<2", "mcp>=1.12,<2"]
droid = [
    "h5py>=3.13,<4",
]

[project.urls]
Homepage = "https://github.com/Koooki3/LEVI"
Citation = "https://github.com/Koooki3/LEVI/blob/main/docs/REFERENCES.md"
Repository = "https://github.com/Koooki3/LEVI"
Documentation = "https://github.com/Koooki3/LEVI#readme"
Issues = "https://github.com/Koooki3/LEVI/issues"
Changelog = "https://github.com/Koooki3/LEVI/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "playwright>=1.50,<2",
    "ruff>=0.16.6",
]

[project.scripts]
levi = "levi.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["levi", "backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
