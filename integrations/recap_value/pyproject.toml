[project]
name = "levi-recap-worker"
version = "0.1.0"
description = "Isolated RECAP value-model worker for LEVI (per-frame V(o_t))"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = [
  "numpy>=1.26,<3",
  "pyarrow>=19,<24",
  "torch>=2.7,<2.11",
  # RLinf's value model runs on transformers 4.53.2 with openpi's
  # transformers_replace patch copied over it (setup.sh applies the vendored
  # copy). rlinf-transformer-openpi==4.53.2 is exactly that combination.
  "transformers==4.53.2",
  "tokenizers>=0.21,<0.22",
  "safetensors>=0.4,<1",
  "sentencepiece>=0.2,<1",
  # Video decode: one RGB24 frame per stored frame, sequentially per episode.
  "av>=12,<17",
]

[project.scripts]
levi-recap-worker = "levi_recap_worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["levi_recap_worker"]

# Keep the core LEVI environment model-free; the same CUDA wheel index as the
# SAM3 worker.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

# Vendored third-party code keeps its upstream style.
[tool.ruff]
extend-exclude = ["levi_recap_worker/rlinf", "vendor"]
