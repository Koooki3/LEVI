[project]
name = "levi-sam3-worker"
version = "0.1.0"
description = "Isolated SAM3 video annotation worker for LEVI"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=1.26,<2",
  "pyarrow>=19,<24",
  "pillow>=10,<13",
  "huggingface-hub>=0.30,<2",
  "torch>=2.7,<2.11",
  "torchvision>=0.22,<0.26",
  "sam3 @ git+https://github.com/facebookresearch/sam3.git@660a5e9e1b8b4c02c0ad97229b88a09a6e4ff5b",
]

[project.scripts]
levi-sam3-worker = "levi_sam3_worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["levi_sam3_worker"]

# Keep the core LEVI environment model-free. Users who opt into this worker
# may select the matching CUDA wheel index during `uv sync`.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
