<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d"><title id="t">One task, three actors: the agent proposes and works, LEVI checks and records, the person holds every gate</title><desc id="d">A swim-lane workflow in nine steps: plan, check, approve, pilot, accept, remaining episodes, review, commit, record. Only the person approves, accepts and commits; the harness records cost and verified facts around the task.</desc><defs><style>@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style><marker id="a_gate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L9 5 L1 8.5 Z" fill="#8f5f00"/></marker><marker id="a_model" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L9 5 L1 8.5 Z" fill="#0b64c6"/></marker><marker id="a_person" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L9 5 L1 8.5 Z" fill="#1a7a38"/></marker><marker id="a_system" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L9 5 L1 8.5 Z" fill="#7a45d6"/></marker><linearGradient id="g_gate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbe7"/><stop offset="1" stop-color="#fff6c9"/></linearGradient><linearGradient id="g_model" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f8ff"/><stop offset="1" stop-color="#e1f0ff"/></linearGradient><linearGradient id="g_person" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1fbf3"/><stop offset="1" stop-color="#dff6e5"/></linearGradient><linearGradient id="g_system" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf6ff"/><stop offset="1" stop-color="#f6ecff"/></linearGradient><linearGradient id="g_panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f8fc"/></linearGradient></defs><rect x="0.6" y="0.6" width="1198.8" height="598.8" rx="16" fill="url(#g_panel)" stroke="#cfd8e3" stroke-width="1.2"/><rect x="32" y="14" width="30" height="3.5" rx="1.75" fill="#0b64c6"/><rect x="64" y="14" width="14" height="3.5" rx="1.75" fill="#7a45d6"/><text x="32" y="40" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#1b2430">A task, step by step</text><text x="32" y="64" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4f5b6c">Agent work is cheap to start and cheap to undo, because only a person can approve, accept and commit.</text><rect x="32" y="96" width="1136" height="124" rx="12" fill="url(#g_model)" fill-opacity="0.55" stroke="#0b64c6" stroke-width="1.0"/><rect x="33.5" y="97.5" width="1133" height="121" rx="10.5" fill="none" stroke="#ffffff" stroke-opacity="0.425" stroke-width="1"/><text x="48" y="118" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#0b64c6">Agent</text><g transform="translate(100 104) scale(0.750)" fill="none" stroke="#0b64c6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="10" y="10" width="4" height="4"/><path d="M9 3v3 M15 3v3 M9 18v3 M15 18v3 M3 9h3 M3 15h3 M18 9h3 M18 15h3"/></g><rect x="32" y="236" width="1136" height="124" rx="12" fill="url(#g_system)" fill-opacity="0.55" stroke="#7a45d6" stroke-width="1.0"/><rect x="33.5" y="237.5" width="1133" height="121" rx="10.5" fill="none" stroke="#ffffff" stroke-opacity="0.425" stroke-width="1"/><text x="48" y="258" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#7a45d6">LEVI</text><g transform="translate(100 244) scale(0.750)" fill="none" stroke="#7a45d6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6 M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></g><rect x="32" y="376" width="1136" height="124" rx="12" fill="url(#g_person)" fill-opacity="0.55" stroke="#1a7a38" stroke-width="1.0"/><rect x="33.5" y="377.5" width="1133" height="121" rx="10.5" fill="none" stroke="#ffffff" stroke-opacity="0.425" stroke-width="1"/><text x="48" y="398" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#1a7a38">Person</text><g transform="translate(100 384) scale(0.750)" fill="none" stroke="#1a7a38" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6"/></g><rect x="44" y="136" width="118" height="62" rx="10" fill="url(#g_model)" stroke="#0b64c6" stroke-width="1.4"/><rect x="45.5" y="137.5" width="115" height="59" rx="8.5" fill="none" stroke="#ffffff" stroke-opacity="0.425" stroke-width="1"/><text x="58" y="160" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#0b64c6">1  Plan</text><text x="58" y="181" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#4f5b6c">a task spec</text><rect x="169" y="276" width="118" height="62" rx="10" fill="url(#g_system)" stroke="#7a45d6" stroke-width="1.4"/><rect x="170.5" y="277.5" width="115" height="59" rx="8.5" fill="none" stroke="#ffffff" stroke-opacity="0.425" stroke-width="1"/><text x="183" y="300" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#7a45d6">2  Check</text><text x="183" y="321" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#4f5b6c">vs the catalog</text><rect x="294" y="416" width="118" height="62" rx="10" fill="url(#g_gate)" stroke="#8f5f00" stroke-width="1.4"/><rect x="295.5" y="417.5" width="115" height="59" rx="8.5" fill="none" stroke="#ffffff" stroke-opacity="0.425" stroke-width="1"/><text x="308" y="440" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#8f5f00">3  Approve</text><text x="308" y="461" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#4f5b6c">plan, person-only</text><rect x="419" y="136" width="118" height="62" rx="10" fill="url(#g_model)" stroke="#0b64c6" stroke-width="1.4"/><rect x="420.5" y="137.5" width="115" height="59" rx="8.5" fill="none" stroke="#ffffff" stroke-opacity="0.425" stroke-width="1"/><text x="433" y="160" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#0b64c6">4  Pilot</text><text x="433" y="181" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#4f5b6c">a small sample</text><rect x="544" y="416" width="118" height="62" rx="10" fill="url(#g_gate)" stroke="#8f5f00" stroke-width="1.4"/><rect x="545.5" y="417.5" width="115" height="59" rx="8.5" fill="none" stroke="#ffffff" stroke-opacity="0.425" stroke-width="1"/><text x="558" y="440" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#8f5f00">5  Accept</text><text x="558" y="461" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#4f5b6c">pilot (default)</text><rect x="669" y="136" width="118" height="62" rx="10" fill="url(#g_model)" stroke="#0b64c6" stroke-width="1.4"/><rect x="670.5" y="137.5" width="115" height="59" rx="8.5" fill="none" stroke="#ffffff" stroke-opacity="0.425" stroke-width="1"/><text x="683" y="160" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#0b64c6">6  Remaining</text><text x="683" y="181" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#4f5b6c">cites its frames</text><rect x="794" y="416" width="118" height="62" rx="10" fill="url(#g_person)" stroke="#1a7a38" stroke-width="1.4"/><rect x="795.5" y="417.5" width="115" height="59" rx="8.5" fill="none" stroke="#ffffff" stroke-opacity="0.425" stroke-width="1"/><text x="808" y="440" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#1a7a38">7  Review</text><text x="808" y="461" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#4f5b6c">each suggestion</text><rect x="919" y="416" width="118" height="62" rx="10" fill="url(#g_gate)" stroke="#8f5f00" stroke-width="1.4"/><rect x="920.5" y="417.5" width="115" height="59" rx="8.5" fill="none" stroke="#ffffff" stroke-opacity="0.425" stroke-width="1"/><text x="933" y="440" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#8f5f00">8  Commit</text><text x="933" y="461" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#4f5b6c">undoable</text><rect x="1044" y="276" width="118" height="62" rx="10" fill="url(#g_system)" stroke="#7a45d6" stroke-width="1.4"/><rect x="1045.5" y="277.5" width="115" height="59" rx="8.5" fill="none" stroke="#ffffff" stroke-opacity="0.425" stroke-width="1"/><text x="1058" y="300" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#7a45d6">9  Record</text><text x="1058" y="321" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#4f5b6c">closes the task</text><path d="M162 167 L165.5 167 L165.5 307 L169 307" fill="none" stroke="#0b64c6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a_model)"/><path d="M287 307 L290.5 307 L290.5 447 L294 447" fill="none" stroke="#7a45d6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a_system)"/><path d="M412 447 L415.5 447 L415.5 167 L419 167" fill="none" stroke="#8f5f00" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a_gate)"/><path d="M537 167 L540.5 167 L540.5 447 L544 447" fill="none" stroke="#0b64c6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a_model)"/><path d="M662 447 L665.5 447 L665.5 167 L669 167" fill="none" stroke="#8f5f00" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a_gate)"/><path d="M787 167 L790.5 167 L790.5 447 L794 447" fill="none" stroke="#0b64c6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a_model)"/><path d="M912 447 L915.5 447 L915.5 447 L919 447" fill="none" stroke="#1a7a38" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a_person)"/><path d="M1037 447 L1040.5 447 L1040.5 307 L1044 307" fill="none" stroke="#8f5f00" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a_gate)"/><rect x="32" y="512" width="1136" height="32" rx="8" fill="url(#g_person)" stroke="#1a7a38" stroke-width="1.2"/><rect x="33.5" y="513.5" width="1133" height="29" rx="6.5" fill="none" stroke="#ffffff" stroke-opacity="0.425" stroke-width="1"/><text x="48" y="533" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" text-anchor="start" fill="#1a7a38">Uncertainty is a valid answer. Each suggestion cites the frames it was read from, and a commit can be undone through the same review.</text><rect x="32" y="552" width="1136" height="32" rx="8" fill="url(#g_system)" stroke="#7a45d6" stroke-width="1.2"/><rect x="33.5" y="553.5" width="1133" height="29" rx="6.5" fill="none" stroke="#ffffff" stroke-opacity="0.425" stroke-width="1"/><text x="48" y="573" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" text-anchor="start" fill="#7a45d6">Around every task the harness records cost per agent and per dataset and keeps what a person verified for the next task.</text></svg>
