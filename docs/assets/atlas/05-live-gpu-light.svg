<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-labelledby="t d"><title id="t">Live annotation beside a robot evaluation: one GPU, shared by turns</title><desc id="d">While a robot evaluation writes rollouts, the live service labels finished episodes with a local model, but only while the policy server is not inferring; its verdicts are automatic and unreviewed until a person reviews them.</desc><defs><style>@keyframes flow{to{stroke-dashoffset:-18}}@keyframes now{from{transform:translateX(0)}to{transform:translateX(1120px)}}@keyframes guard{0%,100%{opacity:.3}50%{opacity:.9}}.flow{animation:flow 3s linear infinite}.now{animation:now 12s linear infinite}.guard{opacity:.6;animation:guard 5s ease-in-out infinite}@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style><marker id="a_gate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L9 5 L1 8.5 Z" fill="#8f5f00"/></marker><marker id="a_model" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L9 5 L1 8.5 Z" fill="#0b64c6"/></marker><marker id="a_person" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L9 5 L1 8.5 Z" fill="#1a7a38"/></marker><marker id="a_system" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L9 5 L1 8.5 Z" fill="#7a45d6"/></marker><linearGradient id="g_box" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fafbfd"/><stop offset="1" stop-color="#f4f7fb"/></linearGradient><linearGradient id="g_danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6f6"/><stop offset="1" stop-color="#ffeceb"/></linearGradient><linearGradient id="g_gate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbe7"/><stop offset="1" stop-color="#fff6c9"/></linearGradient><linearGradient id="g_model" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f8ff"/><stop offset="1" stop-color="#e1f0ff"/></linearGradient><linearGradient id="g_person" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1fbf3"/><stop offset="1" stop-color="#dff6e5"/></linearGradient><linearGradient id="g_system" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf6ff"/><stop offset="1" stop-color="#f6ecff"/></linearGradient><linearGradient id="g_panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f8fc"/></linearGradient></defs><rect x="0.6" y="0.6" width="1198.8" height="678.8" rx="16" fill="url(#g_panel)" stroke="#cfd8e3" stroke-width="1.2"/><rect x="32" y="14" width="30" height="3.5" rx="1.75" fill="#0b64c6"/><rect x="64" y="14" width="14" height="3.5" rx="1.75" fill="#7a45d6"/><text x="32" y="40" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#1b2430">Live annotation beside a robot</text><text x="32" y="64" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4f5b6c">A gate keeps the vision model out of the way while the policy is inferring.</text><rect x="32" y="96" width="270" height="92" rx="10" fill="url(#g_gate)" stroke="#8f5f00" stroke-width="1.4"/><rect x="33.5" y="97.5" width="267" height="89" rx="8.5" fill="none" stroke="#ffffff" stroke-opacity="0.425" stroke-width="1"/><text x="46" y="120" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#8f5f00">Robot evaluation</text><text x="46" y="141" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4f5b6c">policy server infers on the GPU</text><text x="46" y="159" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4f5b6c">client writes rollout folders</text><g transform="translate(268 105) scale(0.917)" fill="none" stroke="#8f5f00" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21h9 M8.5 21v-7"/><circle cx="8.5" cy="12" r="2"/><path d="M10 10.5 15 6.5"/><circle cx="16.5" cy="5.5" r="1.8"/><path d="M17.6 7 20 10.5 M20 10.5l-1.6 2 M20 10.5l1.8 1.8"/></g><rect x="466" y="96" width="268" height="92" rx="10" fill="url(#g_system)" stroke="#7a45d6" stroke-width="1.4"/><rect x="467.5" y="97.5" width="265" height="89" rx="8.5" fill="none" stroke="#ffffff" stroke-opacity="0.425" stroke-width="1"/><text x="480" y="120" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#7a45d6">LEVI live service</text><text x="480" y="141" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4f5b6c">its own workspace</text><text x="480" y="159" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4f5b6c">watcher · queue · GPU gate</text><g transform="translate(700 105) scale(0.917)" fill="none" stroke="#7a45d6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6 M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></g><rect x="898" y="96" width="270" height="92" rx="10" fill="url(#g_model)" stroke="#0b64c6" stroke-width="1.4"/><rect x="899.5" y="97.5" width="267" height="89" rx="8.5" fill="none" stroke="#ffffff" stroke-opacity="0.425" stroke-width="1"/><text x="912" y="120" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#0b64c6">Local vision model</text><text x="912" y="141" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4f5b6c">vLLM · loopback · sleeps/stops idle</text><text x="912" y="159" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4f5b6c">Qwen3.8 judges and segments</text><g transform="translate(1134 105) scale(0.917)" fill="none" stroke="#0b64c6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="10" y="10" width="4" height="4"/><path d="M9 3v3 M15 3v3 M9 18v3 M15 18v3 M3 9h3 M3 15h3 M18 9h3 M18 15h3"/></g><path d="M302 130 L466 130" fill="none" stroke="#8f5f00" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a_gate)"/><path class="flow" d="M302 130 L466 130" fill="none" stroke="#8f5f00" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.1 18"/><text x="384" y="122" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#8f5f00">finished episode</text><path d="M734 130 L898 130" fill="none" stroke="#7a45d6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a_system)"/><path class="flow" d="M734 130 L898 130" fill="none" stroke="#7a45d6" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.1 18"/><text x="816" y="122" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#7a45d6">frames + question</text><path d="M898 164 L734 164" fill="none" stroke="#0b64c6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a_model)"/><path class="flow" d="M898 164 L734 164" fill="none" stroke="#0b64c6" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.1 18"/><text x="816" y="184" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#0b64c6">time segments · outcome</text><rect x="466" y="232" width="268" height="64" rx="10" fill="url(#g_system)" stroke="#7a45d6" stroke-width="1.4"/><rect x="467.5" y="233.5" width="265" height="61" rx="8.5" fill="none" stroke="#ffffff" stroke-opacity="0.425" stroke-width="1"/><text x="480" y="256" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" text-anchor="start" fill="#7a45d6">Automatic, unreviewed labels</text><text x="480" y="277" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4f5b6c">never written as human labels</text><path d="M600 188 L600 232" fill="none" stroke="#7a45d6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a_system)"/><path class="flow" d="M600 188 L600 232" fill="none" stroke="#7a45d6" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.1 18"/><text x="612" y="216" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#7a45d6">writes</text><rect x="466" y="330" width="268" height="64" rx="10" fill="url(#g_person)" stroke="#1a7a38" stroke-width="1.4"/><rect x="467.5" y="331.5" width="265" height="61" rx="8.5" fill="none" stroke="#ffffff" stroke-opacity="0.425" stroke-width="1"/><text x="480" y="354" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" text-anchor="start" fill="#1a7a38">A person reviews</text><text x="480" y="375" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4f5b6c">normal viewer; auto-approve opt-in</text><path d="M600 296 L600 330" fill="none" stroke="#1a7a38" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a_person)"/><path class="flow" d="M600 296 L600 330" fill="none" stroke="#1a7a38" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.1 18"/><text x="612" y="318" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#1a7a38">to review</text><text x="32" y="432" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#5b687a" letter-spacing="1">ONE GPU OVER TIME</text><rect x="32" y="444" width="1136" height="56" rx="10" fill="url(#g_box)" stroke="#c9d3df" stroke-width="1.2"/><rect x="33.5" y="445.5" width="1133" height="53" rx="8.5" fill="none" stroke="#ffffff" stroke-opacity="0.425" stroke-width="1"/><rect x="35" y="450" width="244" height="44" rx="8" fill="url(#g_gate)" stroke="#8f5f00" stroke-width="1.2"/><rect x="36.5" y="451.5" width="241" height="41" rx="6.5" fill="none" stroke="#ffffff" stroke-opacity="0.425" stroke-width="1"/><rect x="285" y="450" width="124" height="44" rx="8" fill="#ffffff" stroke="#c9d3df" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="415" y="450" width="324" height="44" rx="8" fill="url(#g_model)" stroke="#0b64c6" stroke-width="1.2"/><rect x="416.5" y="451.5" width="321" height="41" rx="6.5" fill="none" stroke="#ffffff" stroke-opacity="0.425" stroke-width="1"/><rect x="745" y="450" width="224" height="44" rx="8" fill="url(#g_gate)" stroke="#8f5f00" stroke-width="1.2"/><rect x="746.5" y="451.5" width="221" height="41" rx="6.5" fill="none" stroke="#ffffff" stroke-opacity="0.425" stroke-width="1"/><rect x="975" y="450" width="190" height="44" rx="8" fill="#ffffff" stroke="#c9d3df" stroke-width="1.2" stroke-dasharray="5 4"/><g class="now"><rect x="39" y="446" width="2" height="52" rx="1" fill="#243040" fill-opacity="0.55"/><path d="M33 511 L47 511 L40 500 Z" fill="#243040"/></g><text x="157.0" y="477" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#8f5f00">policy infers</text><text x="347.0" y="477" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#4f5b6c">idle: gate opens</text><text x="577.0" y="477" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0b64c6">model labels the episode</text><text x="857.0" y="477" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#8f5f00">policy infers</text><text x="1070.0" y="477" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#4f5b6c">model sleeps</text><rect x="32" y="520" width="1136" height="32" rx="8" fill="url(#g_gate)" stroke="#8f5f00" stroke-width="1.2"/><rect x="33.5" y="521.5" width="1133" height="29" rx="6.5" fill="none" stroke="#ffffff" stroke-opacity="0.425" stroke-width="1"/><text x="48" y="541" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" text-anchor="start" fill="#8f5f00">The service yields the GPU when another process computes; with a shared lock file configured it holds it while its model server is up. Start it before the policy server.</text><rect x="32" y="560" width="1136" height="32" rx="8" fill="url(#g_danger)" stroke="#c4242f" stroke-width="1.2"/><rect x="33.5" y="561.5" width="1133" height="29" rx="6.5" fill="none" stroke="#ffffff" stroke-opacity="0.425" stroke-width="1"/><text x="48" y="581" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" text-anchor="start" fill="#c4242f">It never writes the rollout folders, never connects to the robot, never writes a human outcome label.</text><rect x="32" y="600" width="1136" height="32" rx="8" fill="url(#g_system)" stroke="#7a45d6" stroke-width="1.2"/><rect x="33.5" y="601.5" width="1133" height="29" rx="6.5" fill="none" stroke="#ffffff" stroke-opacity="0.425" stroke-width="1"/><text x="48" y="621" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" text-anchor="start" fill="#7a45d6">Status: the gate is verified with fakes; sleep and wake beside a real policy server are not yet verified with the real model.</text></svg>
