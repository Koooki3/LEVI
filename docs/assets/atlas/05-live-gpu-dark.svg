<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 654" width="1200" height="654" role="img" aria-labelledby="t d"><title id="t">Live annotation beside a robot evaluation: one GPU, shared by turns</title><desc id="d">While a robot evaluation writes rollouts, the live service labels finished episodes with a local model, but only while the policy server is not inferring; its verdicts are automatic and unreviewed until a person reviews them.</desc><defs><style>@keyframes flow{to{stroke-dashoffset:-18}}.flow{animation:flow 3s linear infinite}@keyframes now{from{transform:translateX(0)}to{transform:translateX(1120px)}}.now{animation:now 12s linear infinite;animation-delay:-3.996s}@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style><marker id="a_gate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L9 5 L1 8.5 Z" fill="#dca62c"/></marker><marker id="a_model" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L9 5 L1 8.5 Z" fill="#62a8ff"/></marker><marker id="a_person" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L9 5 L1 8.5 Z" fill="#47c15f"/></marker><marker id="a_system" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L9 5 L1 8.5 Z" fill="#c29bff"/></marker><linearGradient id="g_box" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#202732"/><stop offset="1" stop-color="#161d28"/></linearGradient><linearGradient id="g_danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#492025"/><stop offset="1" stop-color="#40161b"/></linearGradient><linearGradient id="g_gate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#372f14"/><stop offset="1" stop-color="#2e2509"/></linearGradient><linearGradient id="g_model" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c3049"/><stop offset="1" stop-color="#112640"/></linearGradient><linearGradient id="g_person" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b3926"/><stop offset="1" stop-color="#10301c"/></linearGradient><linearGradient id="g_system" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34264b"/><stop offset="1" stop-color="#2a1c42"/></linearGradient><linearGradient id="g_panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e131b"/><stop offset="1" stop-color="#0b0f16"/></linearGradient></defs><rect x="0.6" y="0.6" width="1198.8" height="652.8" rx="16" fill="url(#g_panel)" stroke="#2c3644" stroke-width="1.2"/><rect x="32" y="14" width="30" height="3.5" rx="1.75" fill="#62a8ff"/><rect x="64" y="14" width="14" height="3.5" rx="1.75" fill="#c29bff"/><text x="32" y="40" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#e6ecf4">Live annotation beside a robot</text><text x="32" y="64" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#a3afc0">A gate keeps the vision model out of the way while the policy is inferring.</text><rect x="32" y="96" width="270" height="92" rx="10" fill="url(#g_gate)" stroke="#dca62c" stroke-width="1.4"/><rect x="33.5" y="97.5" width="267" height="89" rx="8.5" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/><text x="46" y="120" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#dca62c">Robot evaluation</text><text x="46" y="141" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#a3afc0">policy server infers on the GPU</text><text x="46" y="159" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#a3afc0">client writes rollout folders</text><g transform="translate(268 105) scale(0.917)" fill="none" stroke="#dca62c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21h9 M8.5 21v-7"/><circle cx="8.5" cy="12" r="2"/><path d="M10 10.5 15 6.5"/><circle cx="16.5" cy="5.5" r="1.8"/><path d="M17.6 7 20 10.5 M20 10.5l-1.6 2 M20 10.5l1.8 1.8"/></g><rect x="466" y="96" width="268" height="92" rx="10" fill="url(#g_system)" stroke="#c29bff" stroke-width="1.4"/><rect x="467.5" y="97.5" width="265" height="89" rx="8.5" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/><text x="480" y="120" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#c29bff">LEVI live service</text><text x="480" y="141" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#a3afc0">its own workspace</text><text x="480" y="159" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#a3afc0">watcher · queue · GPU gate</text><g transform="translate(700 105) scale(0.917)" fill="none" stroke="#c29bff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6 M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></g><rect x="898" y="96" width="270" height="92" rx="10" fill="url(#g_model)" stroke="#62a8ff" stroke-width="1.4"/><rect x="899.5" y="97.5" width="267" height="89" rx="8.5" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/><text x="912" y="120" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#62a8ff">Local vision model</text><text x="912" y="141" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#a3afc0">vLLM · loopback · sleeps/stops idle</text><text x="912" y="159" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#a3afc0">Qwen3.8 judges and segments</text><g transform="translate(1134 105) scale(0.917)" fill="none" stroke="#62a8ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="10" y="10" width="4" height="4"/><path d="M9 3v3 M15 3v3 M9 18v3 M15 18v3 M3 9h3 M3 15h3 M18 9h3 M18 15h3"/></g><path d="M302 130 L466 130" fill="none" stroke="#dca62c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a_gate)"/><path class="flow" d="M302 130 L466 130" fill="none" stroke="#dca62c" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.1 18"/><text x="384" y="122" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#dca62c">finished episode</text><path d="M734 130 L898 130" fill="none" stroke="#c29bff" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a_system)"/><path class="flow" d="M734 130 L898 130" fill="none" stroke="#c29bff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.1 18"/><text x="816" y="122" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#c29bff">frames + question</text><path d="M898 164 L734 164" fill="none" stroke="#62a8ff" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a_model)"/><path class="flow" d="M898 164 L734 164" fill="none" stroke="#62a8ff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.1 18"/><text x="816" y="184" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#62a8ff">time segments · outcome</text><rect x="466" y="232" width="268" height="64" rx="10" fill="url(#g_system)" stroke="#c29bff" stroke-width="1.4"/><rect x="467.5" y="233.5" width="265" height="61" rx="8.5" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/><text x="480" y="256" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" text-anchor="start" fill="#c29bff">Automatic, unreviewed labels</text><text x="480" y="277" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#a3afc0">never written as human labels</text><path d="M600 188 L600 232" fill="none" stroke="#c29bff" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a_system)"/><path class="flow" d="M600 188 L600 232" fill="none" stroke="#c29bff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.1 18"/><text x="612" y="216" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#c29bff">writes</text><rect x="466" y="330" width="268" height="64" rx="10" fill="url(#g_person)" stroke="#47c15f" stroke-width="1.4"/><rect x="467.5" y="331.5" width="265" height="61" rx="8.5" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/><text x="480" y="354" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" text-anchor="start" fill="#47c15f">A person reviews</text><text x="480" y="375" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#a3afc0">normal viewer; auto-approve opt-in</text><path d="M600 296 L600 330" fill="none" stroke="#47c15f" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a_person)"/><path class="flow" d="M600 296 L600 330" fill="none" stroke="#47c15f" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.1 18"/><text x="612" y="318" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#47c15f">to review</text><text x="32" y="432" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#8591a3" letter-spacing="1">ONE GPU OVER TIME</text><rect x="32" y="444" width="1136" height="56" rx="10" fill="url(#g_box)" stroke="#47536a" stroke-width="1.2"/><rect x="33.5" y="445.5" width="1133" height="53" rx="8.5" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/><rect x="35" y="450" width="244" height="44" rx="8" fill="url(#g_gate)" stroke="#dca62c" stroke-width="1.2"/><rect x="36.5" y="451.5" width="241" height="41" rx="6.5" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/><rect x="285" y="450" width="124" height="44" rx="8" fill="#0e131b" stroke="#47536a" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="415" y="450" width="324" height="44" rx="8" fill="url(#g_model)" stroke="#62a8ff" stroke-width="1.2"/><rect x="416.5" y="451.5" width="321" height="41" rx="6.5" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/><rect x="745" y="450" width="224" height="44" rx="8" fill="url(#g_gate)" stroke="#dca62c" stroke-width="1.2"/><rect x="746.5" y="451.5" width="221" height="41" rx="6.5" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/><rect x="975" y="450" width="190" height="44" rx="8" fill="#0e131b" stroke="#47536a" stroke-width="1.2" stroke-dasharray="5 4"/><g class="now" transform="translate(373 0)"><rect x="39" y="446" width="2" height="52" rx="1" fill="#e6ecf4" fill-opacity="0.55"/><path d="M33 511 L47 511 L40 500 Z" fill="#e6ecf4"/></g><text x="157.0" y="477" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#dca62c">policy infers</text><text x="347.0" y="477" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#a3afc0">idle: gate opens</text><text x="577.0" y="477" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#62a8ff">model labels the episode</text><text x="857.0" y="477" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#dca62c">policy infers</text><text x="1070.0" y="477" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#a3afc0">model sleeps</text><rect x="32" y="520" width="1136" height="32" rx="8" fill="url(#g_danger)" stroke="#ff8279" stroke-width="1.2"/><rect x="33.5" y="521.5" width="1133" height="29" rx="6.5" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/><text x="48" y="541" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" text-anchor="start" fill="#ff8279">It never writes the rollout folders, never connects to the robot, never writes a human outcome label.</text><text x="32" y="578" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#8591a3">The service yields the GPU when another process computes; with a shared lock file configured it holds it while its model server is up. Start it before the policy server.</text><text x="32" y="602" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#8591a3">Status: the gate is verified with fakes; sleep and wake beside a real policy server are not yet verified with the real model.</text><text x="32" y="626" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#8591a3">In the AERI subtask loop (earlier versions: external mode only on the robot) the policy and the vision model take turns on the GPU by default.</text></svg>
