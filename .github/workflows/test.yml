# Modified for LEVI (2026); see NOTICE and docs/UPSTREAM.md.
name: LEVI checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      # Both legs report: a failure in one must not cancel the other, or a
      # flaky test hides whether the other dependency set passes.
      fail-fast: false
      matrix:
        agent: [false, true]
    # Pinned instead of ubuntu-latest, which moves to Ubuntu 26 from
    # 2026-10-19 (actions/runner-images#14748). Re-evaluate once Ubuntu 26
    # images are GA and ffmpeg, uv and bun are known to work there (or when
    # GitHub announces the end of the 24.04 image).
    runs-on: ubuntu-24.04
    # A full run takes about 15 minutes; a hung test must not hold a runner
    # for the default 6 hours.
    timeout-minutes: 45
    env:
      LEVI_WORKSPACE: ${{ github.workspace }}/.state
      UV_CACHE_DIR: ${{ github.workspace }}/.state/.cache/uv
      NEXT_TELEMETRY_DISABLED: "1"
      # A fresh CI workspace must not download the DROID test sample.
      LEVI_DROID_SAMPLE: "off"
      CUDA_VISIBLE_DEVICES: ""
      # Shared runners are slower than a workstation: the tests' wait helpers
      # get twice their wall-clock budget (tests/conftest.py, scaled()).
      LEVI_TEST_TIME_SCALE: "2"
    steps:
      # Node 24 releases (the Node 20 runtime is deprecated on the runners).
      - uses: actions/checkout@v7
        with:
          # `levi dev check-contracts` compares the AERI contract snapshots with the
          # ones on main (merge-base), which needs the full history.
          fetch-depth: 0
      # setup-uv publishes no floating major tag since v8; pin the release.
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.10"
      - run: mkdir -p .state/tmp/build
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - if: ${{ !matrix.agent }}
        run: uv sync --locked --group dev
      - if: ${{ matrix.agent }}
        run: uv sync --locked --group dev --extra agent
      - run: bun install --frozen-lockfile
      - run: bun run validate
      - run: uv run --no-sync levi dev check-contracts
      - run: uv run --no-sync ruff check .
      - id: pytest
        run: >-
          uv run --no-sync pytest --basetemp=.state/tmp/build/pytest
          --junitxml=.state/tmp/build/junit.xml -rfE
      # The failed tests' names (and first lines of their messages) in the
      # run's summary page, so a failure is identifiable without the logs.
      - name: Failed tests summary
        if: ${{ failure() && steps.pytest.conclusion == 'failure' }}
        run: python3 scripts/ci_junit_summary.py .state/tmp/build/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Upload pytest results
        if: ${{ failure() && steps.pytest.conclusion == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: pytest-junit-agent-${{ matrix.agent }}
          path: .state/tmp/build/junit.xml
          if-no-files-found: ignore
          retention-days: 14
      - run: bun run build
