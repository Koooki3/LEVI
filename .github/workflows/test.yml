# Modified for LEVI (2026); see NOTICE and docs/UPSTREAM.md.
name: LEVI checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        agent: [false, true]
    runs-on: ubuntu-latest
    env:
      LEVI_WORKSPACE: ${{ github.workspace }}/.state
      UV_CACHE_DIR: ${{ github.workspace }}/.state/.cache/uv
      NEXT_TELEMETRY_DISABLED: "1"
      # A fresh CI workspace must not download the DROID test sample.
      LEVI_DROID_SAMPLE: "off"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: mkdir -p .state/tmp/build
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - if: ${{ !matrix.agent }}
        run: uv sync --locked --group dev
      - if: ${{ matrix.agent }}
        run: uv sync --locked --group dev --extra agent
      - run: bun install --frozen-lockfile
      - run: bun run validate
      - run: uv run --no-sync levi dev check-contracts
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pytest --basetemp=.state/tmp/build/pytest
      - run: bun run build
